<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Importar una carpeta local</title><desc id="desc">Panel de Workspace Settings para seleccionar una carpeta local y crear endpoints.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#182d3b"/></linearGradient></defs>
  <rect width="960" height="600" rx="24" fill="url(#bg)"/><rect x="32" y="32" width="896" height="536" rx="18" fill="#0d131c" stroke="#31536a"/><rect x="32" y="32" width="220" height="536" rx="18" fill="#121d28"/><circle cx="70" cy="70" r="16" fill="#38bdf8"/><text x="98" y="77" fill="#f1f8ff" font-family="Arial" font-size="20" font-weight="700">Workspace</text><text x="62" y="140" fill="#9db0bf" font-family="Arial" font-size="14">SETTINGS</text><rect x="52" y="160" width="180" height="44" rx="10" fill="#123c51"/><text x="72" y="188" fill="#b9edff" font-family="Arial" font-size="15">Importar proyecto</text><text x="72" y="244" fill="#9db0bf" font-family="Arial" font-size="15">Teamwork</text><text x="72" y="286" fill="#9db0bf" font-family="Arial" font-size="15">Seguridad</text>
  <text x="292" y="92" fill="#f5fbff" font-family="Arial" font-size="28" font-weight="700">Importar carpeta local</text><text x="292" y="122" fill="#9db0bf" font-family="Arial" font-size="15">Selecciona tu proyecto y deja que API-Wallet encuentre sus rutas.</text><rect x="292" y="164" width="586" height="178" rx="14" fill="#13202b" stroke="#31536a"/><path d="M500 205h48l16 18h100v75H500z" fill="#1f789c" opacity=".9"/><path d="M500 205h48l16 18h100" fill="none" stroke="#7dd3fc" stroke-width="3"/><text x="400" y="326" fill="#d2f4ff" font-family="Arial" font-size="15">Arrastra una carpeta aquí</text><rect x="510" y="374" width="160" height="42" rx="9" fill="#0ea5e9"/><text x="539" y="400" fill="white" font-family="Arial" font-size="14" font-weight="700">Elegir carpeta</text><rect x="292" y="452" width="586" height="58" rx="10" fill="#13202b" stroke="#264454"/><circle cx="320" cy="481" r="7" fill="#4ade80"/><text x="340" y="487" fill="#d2e4ed" font-family="Arial" font-size="14">Proyecto seleccionado · 18 archivos compatibles</text>
</svg>
