<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Importar desde un repositorio</title><desc id="desc">Panel de Workspace Settings con URL de repositorio, análisis y endpoints detectados.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#171322"/><stop offset="1" stop-color="#24193b"/></linearGradient><linearGradient id="accent" x1="0" x2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#c084fc"/></linearGradient></defs>
  <rect width="960" height="600" rx="24" fill="url(#bg)"/><rect x="32" y="32" width="896" height="536" rx="18" fill="#0f0e17" stroke="#59447e"/>
  <rect x="32" y="32" width="220" height="536" rx="18" fill="#171522"/><circle cx="70" cy="70" r="16" fill="#8b5cf6"/><text x="98" y="77" fill="#f4f0ff" font-family="Arial" font-size="20" font-weight="700">Workspace</text>
  <text x="62" y="140" fill="#aaa1bf" font-family="Arial" font-size="14">SETTINGS</text><rect x="52" y="160" width="180" height="44" rx="10" fill="#2b2050"/><text x="72" y="188" fill="#d9c8ff" font-family="Arial" font-size="15">Importar proyecto</text><text x="72" y="244" fill="#aaa1bf" font-family="Arial" font-size="15">Teamwork</text><text x="72" y="286" fill="#aaa1bf" font-family="Arial" font-size="15">Seguridad</text>
  <text x="292" y="92" fill="#f8f7fb" font-family="Arial" font-size="28" font-weight="700">Importar desde un repo</text><text x="292" y="122" fill="#aaa1bf" font-family="Arial" font-size="15">Analiza rutas y crea endpoints automáticamente.</text>
  <rect x="292" y="162" width="586" height="58" rx="10" fill="#191725" stroke="#51436c"/><text x="314" y="197" fill="#cbc3d9" font-family="Arial" font-size="15">https://github.com/acme/payments-api</text><rect x="728" y="173" width="132" height="36" rx="8" fill="url(#accent)"/><text x="747" y="196" fill="white" font-family="Arial" font-size="13" font-weight="700">Analizar repo</text>
  <rect x="292" y="252" width="586" height="246" rx="14" fill="#171522" stroke="#34284b"/><text x="316" y="287" fill="#f4f0ff" font-family="Arial" font-size="16" font-weight="700">Resumen del análisis</text><circle cx="324" cy="326" r="6" fill="#4ade80"/><text x="340" y="332" fill="#d4cce0" font-family="Arial" font-size="14">24 rutas detectadas</text><circle cx="324" cy="365" r="6" fill="#60a5fa"/><text x="340" y="371" fill="#d4cce0" font-family="Arial" font-size="14">3 colecciones sugeridas</text><circle cx="324" cy="404" r="6" fill="#fbbf24"/><text x="340" y="410" fill="#d4cce0" font-family="Arial" font-size="14">8 variables de configuración</text><rect x="690" y="438" width="160" height="38" rx="8" fill="#8b5cf6"/><text x="715" y="462" fill="white" font-family="Arial" font-size="13" font-weight="700">Crear endpoints</text>
</svg>
