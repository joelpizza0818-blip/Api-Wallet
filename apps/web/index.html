<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API-Wallet — Gestión de APIs y credenciales</title>
    <meta name="description" content="Centraliza, organiza y administra todas tus APIs y API Keys en un único lugar." />
  </head>
  <body>
    <div id="root">
      <div class="app-boot-screen" role="status" aria-live="polite">
        <div class="app-boot-mark">API</div>
        <strong>API-Wallet</strong>
        <span>Cargando workspace...</span>
      </div>
    </div>
    <style>
      .app-boot-screen { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 10px; background: #0f1118; color: #f3f4f6; font: 14px system-ui, sans-serif; }
      .app-boot-mark { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 10px; background: #7c3aed; color: #fff; font-size: 12px; font-weight: 800; letter-spacing: .08em; }
      .app-boot-screen span { color: #9ca3af; font-size: 12px; }
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
